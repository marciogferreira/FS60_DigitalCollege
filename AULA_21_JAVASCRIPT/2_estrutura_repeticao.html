<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura de Repetição</title>
</head>
<body>
    <script>
        // FOR
        let contador = 1
        for(contador; contador <= 100; contador++) {
            // Bloco de Codigo
            document.write(contador + " Olá Jovem <br />")
            if(contador == 3) {
                document.write("Chegou no Valor 3 <br />")
            }
        }
        
        for(let x = 100; x >= 1; x--) {
            if(x % 2 == 0) {
                document.write(x + "<br  />")
            }
        }
        const numero1 = '1'
        const numero2 = 1
        const condicao = numero1 !== numero2

        // WHILE
        let cont = 0
        while(cont < 10) {
            // Bloco de codigo
            document.write(cont  + " - WHILE")
            cont++
        }

        
    </script>
</body>
</html>
