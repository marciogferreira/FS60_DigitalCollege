<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const alunos = [
            "Mayara", // 0 
            "Iasmin", 
            "Elane", 
            "Julio", 
            "Alessandro", 
            "Caio",
            "Maria"
        ]
        document.write("<ul>")
        for(let i = 0; i < alunos.length; i++) {
            if(alunos[i] == 'Elane') {
                document.write(`<li><strong>${alunos[i]}</strong></li>`)
            } else {
                document.write(`<li>${alunos[i]}</li>`)
            }
        }
        document.write("</ul>")


        
    </script>
</body>
</html>
