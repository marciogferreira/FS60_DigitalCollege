<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="col-md-4 offset-md-4">
            <label for="inputPassword5" class="form-label">Password</label>
            <input type="password" id="inputPassword5" class="form-control" aria-describedby="passwordHelpBlock">
            <div id="passwordHelpBlock" class="form-text">
                Your password must be 8-20 characters long, contain letters and numbers, and must not contain spaces, special characters, or emoji.
            </div>
        </div>
    </div>

    <script>
        // const inputPassword = document.querySelector('#inputPassword5')
        const inputPassword = document.getElementById('inputPassword5')
        // document.getElementsByClassName('')
        const messageCx = document.getElementById('passwordHelpBlock')

        inputPassword.addEventListener('keyup', () => {
            const password = inputPassword.value
            console.log(password)

            if(password.length > 10) {
                messageCx.style.color = 'red'
                messageCx.innerHTML = 'Senha nao pode possui mais de <strong>50 caracteres</strong>';
            } else {
                messageCx.innerHTML = ''
            }
        })

    </script>
</body>
</html>
