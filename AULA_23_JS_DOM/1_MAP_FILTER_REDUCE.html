        const alunos = [

        ]

            }
        })


        // REDUCE
        const produtos = [
            { nome: 'Mouse', qtde: 10, valor: 25.99 },
            { nome: 'Teclado', qtde: 8, valor: 45.99 },
            { nome: 'Monitor', qtde: 3, valor: 895.99 },
